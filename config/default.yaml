# =====================================================================
# Lane Analytics — default configuration
# =====================================================================

video:
  width: 720
  height: 576
  fps: 25
  sample_hz: 1

# =====================================================================
# Horizon detection
# =====================================================================

horizon:
  enabled: true
  search_top_frac: 0.50
  search_bot_frac: 0.70
  variance_threshold: 30.0
  run_length: 5
  smoothing_alpha: 0.25
  min_y_frac: 0.68
  max_y_frac: 0.68
# =====================================================================
# Lane color detection
# =====================================================================

lane_color:
  white:
    h_min: 0
    h_max: 179
    s_min: 0
    s_max: 80
    v_min: 110
    v_max: 255

  yellow:
    enabled: false
    h_min: 10
    h_max: 40
    s_min: 60
    s_max: 255
    v_min: 100
    v_max: 255


# =====================================================================
# Canny edge detection
# =====================================================================

canny:
  enabled: true
  blur_kernel: 5
  low_threshold: 50
  high_threshold: 150


# =====================================================================
# Hough line detection
# =====================================================================

hough:
  enabled: true
  rho: 1.0
  theta_deg: 1.0
  threshold: 20
  min_line_length: 20
  max_line_gap: 30
  slope_abs_min: 0.30
  slope_abs_max: 3.0


# =====================================================================
# Connected components
# =====================================================================

components:
  min_area_frac: 0.0004
  max_area_frac: 0.03
  height_cap_frac: 0.22
  width_cap_frac: 0.30
  aspect_ratio_max: 6.0
  fill_ratio_min: 0.15
  bottom_relax_frac: 0.25
  bottom_aspect_ratio_max: 10.0
  bottom_fill_ratio_min: 0.10
  bottom_height_cap_frac: 0.50
  bottom_width_cap_frac: 0.50


# =====================================================================
# REGION OF INTEREST
# =====================================================================

roi:
  enabled: true

  vertices:
    - [-0.10,0.90]
    - [0.35, 0.50]
    - [0.68, 0.50]
    - [1.10, 0.90]


# =====================================================================
# Sliding-window lane fitting
# =====================================================================

sliding_window:

sliding_window:
  n_windows: 20
  window_width_frac: 0.18               # was 0.15 → wider windows
  min_pixels_to_recenter: 10            # was 15
  min_pixels_total: 80                  # was 100
  min_pixels_per_window: 5
  max_fit_rms_px: 30.0   

  vanishing_x_frac: 0.50
  left_max_x_frac: 0.58
  right_min_x_frac: 0.42

  max_recenter_jump_frac: 0.08
  check_curve_direction: true

  left_base_shift_px: -20
  right_base_shift_px: 0

  tracking_enabled: true
  tracking_margin_px: 150

  


# =====================================================================
# Lane validation
# =====================================================================

validation:
  max_sweep_frac: 0.60
  min_lane_width_px: 30
  max_lane_width_px: 800
  max_width_variation: 1.0


# =====================================================================
# Temporal lane state
# =====================================================================

lane_state:
  hold_frames: 15
  miss_frames: 25
  smoothing_alpha: 0.30
  min_confidence: 0.10


# =====================================================================
# Ego vehicle position
# =====================================================================

ego_position:
  ego_x_frac: 0.50
  lane_eval_y_frac: 0.85


# =====================================================================
# Lane change detection
# =====================================================================
lane_change:

  min_boundary_shift_frac: 0.30
  min_boundary_shift_px: 90.0

  smooth_window: 3
  baseline_window: 6


  persist_samples: 2


  cooldown_samples: 12

  min_confidence: 0.15


  lane_width_min_px: 100.0
  lane_width_max_px: 700.0

  
  enforce_alternation: true

# =====================================================================
# Road sign detection
# =====================================================================

sign_detect:
  enabled: true
  weights: models/indian_signs.pt

  conf_threshold: 0.35
  iou_threshold: 0.45
  imgsz: 640
  device: cpu

  min_bbox_px: 20
  max_bbox_px: 250

  artifact_x1: 0.64
  artifact_y1: 0.60
  artifact_x2: 0.75
  artifact_y2: 0.72


# =====================================================================
# Sign tracking
# =====================================================================

sign_track:
  iou_match_threshold: 0.35
  max_age: 15
  min_hits: 3